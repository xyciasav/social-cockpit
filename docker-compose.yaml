services:
  social-cockpit:
    image: ghcr.io/xyciasav/social-cockpit:${APP_VERSION:-1.11.3}
    container_name: social-cockpit
    restart: unless-stopped
    ports:
      - "${SOCIAL_COCKPIT_PORT:-38427}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATA_DIR: /app/data
      COMFYUI_PORT: ${COMFYUI_PORT:-8188}
      COMFYUI_URL: ${COMFYUI_URL:-}
    volumes:
      - social-cockpit-data:/app/data
volumes:
  social-cockpit-data:
