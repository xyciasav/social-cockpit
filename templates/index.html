<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Social Cockpit</title><link rel="stylesheet" href="/static/style.css"></head><body><header><div class="brand"><b>SC</b><span>Social Cockpit <small>v{{version}}</small></span></div><nav><button data-tab="build" class="active">Build Posts</button><button data-tab="library">Information</button><button data-tab="tones">Tones</button><button data-tab="review">Review</button><button data-tab="settings">Settings</button></nav></header><main><section id="build" class="tab active"><h1>Build posts</h1><p>Choose the inputs. Qwen writes the final copy.</p><div class="grid"><form id="generate" class="card"><label>How many posts?<input name="count" type="number" min="1" max="30" value="3"></label><div class="row"><label>Start<input name="start" type="datetime-local" required></label><label>End<input name="end" type="datetime-local" required></label></div><label>What are you covering?<input name="subject" placeholder="Halloween Show, Instrument Closet…" required></label><label>Tone<select name="tone_id" id="tone-select"></select></label><label>Anything else?<textarea name="instructions" placeholder="Optional direction or detail"></textarea></label><button>Generate drafts</button></form><div class="card"><h2>Pull from information</h2><div id="build-library"></div></div></div></section><section id="library" class="tab"><h1>Information</h1><p>Add events, community programs, reusable links, images, and flyers.</p><div class="grid"><form id="library-form" class="card"><label>Category<select name="category"><option>Event</option><option>Community</option><option>Program</option><option>Information</option><option>Link</option></select></label><label>Title<input name="title" required></label><label>Details<textarea name="details"></textarea></label><label>Link<input name="url"></label><button>Save information</button><hr><label>Upload image or flyer<input id="file" type="file" accept="image/*,.pdf"></label></form><div id="library-list"></div></div></section><section id="tones" class="tab"><h1>Tones</h1><div class="grid"><form id="tone-form" class="card"><label>Name<input name="name" required></label><label>Prompt<textarea name="prompt" required placeholder="Warm, direct, no corporate jargon…"></textarea></label><button>Save tone</button></form><div id="tone-list"></div></div></section><section id="review" class="tab"><h1>Review posts</h1><p>Edit copy and time, regenerate, reject, or approve to send to Buffer.</p><div id="draft-list"></div></section><section id="settings" class="tab"><h1>Settings</h1><form id="settings-form" class="card narrow"><label>LM Studio URL<input name="lm_url"></label><label>Qwen model ID<input name="lm_model"></label><div class="row"><label>Temperature<input name="temperature" type="number" step=".1"></label><label>Max tokens<input name="max_tokens" type="number"></label></div><label>Buffer API key<input name="buffer_token" type="password"></label><label>Buffer channel ID<input name="buffer_channel"></label><button>Save settings</button></form></section></main><div id="toast"></div><script src="/static/app.js"></script></body></html>
